name: TypeScript migration checks

on:
  pull_request:
    branches:
      - migration/import-grouppp-baseline
  push:
    branches:
      - migration/typescript-stage-1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
