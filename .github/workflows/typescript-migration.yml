name: TypeScript migration checks

on:
  pull_request:
    branches:
      - migration/import-grouppp-baseline
      - migration/typescript-stage-1
      - migration/typescript-stage-2
      - migration/typescript-stage-3
      - migration/typescript-stage-4
      - migration/typescript-stage-5
      - migration/typescript-stage-6
      - migration/typescript-stage-7
      - migration/typescript-stage-8
      - migration/typescript-stage-9
  push:
    branches:
      - migration/typescript-stage-1
      - migration/typescript-stage-2
      - migration/typescript-stage-3
      - migration/typescript-stage-4
      - migration/typescript-stage-5
      - migration/typescript-stage-6
      - migration/typescript-stage-7
      - migration/typescript-stage-8
      - migration/typescript-stage-9

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install smoke-test browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Smoke tests
        run: node tests/smoke.mjs
